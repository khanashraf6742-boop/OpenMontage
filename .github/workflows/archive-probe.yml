name: Archive probe (nasheed)

on:
  push:
    paths:
      - ".github/workflows/archive-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Search archive.org
        continue-on-error: true
        run: python3 scripts/archive_search.py 2>&1 | tee -a .nasheed-probe/manifest.txt
      - name: Commit
        if: always()
        run: |
          ls -lh .nasheed-probe || true
          git config user.name  "nasheed-probe-bot"
          git config user.email "nasheed-probe@users.noreply.github.com"
          git add -f .nasheed-probe
          git commit -m "chore: archive.org nasheed candidates" || echo nothing
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 8
          done

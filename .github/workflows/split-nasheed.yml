name: Split wedding nasheed (vocals / music)

on:
  push:
    paths:
      - ".github/workflows/split-nasheed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --quiet --upgrade pip
      - name: Fetch source audio
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_wedding_nasheed.py
      - name: Split with Demucs (fine-tuned)
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet demucs soundfile
          SRC=.nasheed-src/wedding_nasheed_slowed_reverb.mp3
          [ -f "$SRC" ] || SRC=$(ls .nasheed-src/wedding_nasheed_slowed*.mp3 | head -1)
          echo "splitting $SRC" | tee -a .nasheed-src/split.log
          demucs -n htdemucs_ft --two-stems=vocals -o work/sep "$SRC" 2>&1 | tail -25 | tee -a .nasheed-src/split.log
          V=$(find work/sep -name 'vocals.wav' | head -1)
          M=$(find work/sep -name 'no_vocals.wav' | head -1)
          echo "vocals=$V bed=$M" | tee -a .nasheed-src/split.log
          ffmpeg -y -hide_banner -loglevel error -i "$V" -c:a flac -compression_level 8 .nasheed-src/wedding_nasheed_VOCALS.flac
          ffmpeg -y -hide_banner -loglevel error -i "$M" -c:a libmp3lame -b:a 192k .nasheed-src/wedding_nasheed_MUSICBED.mp3
          echo OK > .nasheed-src/SPLIT_OK.txt
      - name: Commit
        if: always()
        run: |
          ls -lh .nasheed-src || true
          git config user.name  "nasheed-bot"
          git config user.email "nasheed-bot@users.noreply.github.com"
          git add -f .nasheed-src
          git commit -m "chore: wedding nasheed source + demucs split" || echo nothing
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 8
          done
